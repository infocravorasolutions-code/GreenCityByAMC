plugins {
    // Provided via `pluginManagement { includeBuild(...) }` in android/settings.gradle
    id("com.facebook.react.rootproject")

    // Downloaded from Gradle plugin repos
    id("com.android.application") version "8.2.2" apply false
    id("com.android.library") version "8.2.2" apply false
    id("org.jetbrains.kotlin.android") version "2.2.10" apply false
    id("com.facebook.react") apply false
    id("com.google.gms.google-services") version "4.4.2" apply false
}

ext {
    buildToolsVersion = "36.0.0"
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    ndkVersion = "27.1.12297006"
}

subprojects { proj ->
    proj.plugins.withId("com.android.application") {
        proj.android.ndkVersion = rootProject.ext.ndkVersion
    }
    proj.plugins.withId("com.android.library") {
        proj.android.ndkVersion = rootProject.ext.ndkVersion
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo"
        }
    }
}
